name: skills readme

# Keeps the "Open-source agent skills" block of the profile README in step with
# skills.caffeinity.com. The site's publish job can trigger this right after a
# deploy (repository_dispatch); the hourly schedule covers it when it does not.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [skills-updated]

permissions:
  contents: write

concurrency:
  group: skills-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: regenerate the skills block
        run: python .github/scripts/skills_section.py
      - name: commit if it changed
        run: |
          set -euo pipefail
          [ -n "$(git status --porcelain README.md)" ] || { echo "README.md already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the skills list from skills.caffeinity.com"
          git push
